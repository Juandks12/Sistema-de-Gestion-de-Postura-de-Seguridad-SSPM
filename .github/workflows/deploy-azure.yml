name: Deploy Azure

# Publica y firma la imagen de la API en GHCR y despliega API (Container Apps) y
# frontend (Static Web Apps) en Azure con los workflows estándar de
# miguelortiz13/github-workflows. Entra con OIDC: no hay secretos guardados.
# Sin las variables de Azure del repo solo publica y firma la imagen (ver
# infra/README.md).
on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".github/workflows/deploy-azure.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  image:
    name: Imagen de la API (GHCR)
    uses: miguelortiz13/github-workflows/.github/workflows/container-build.yml@v0.4.0
    permissions:
      contents: read
      packages: write
    with:
      image-name: sspm-api
      context: backend
      target: production
      push: true

  sign:
    name: Firma y SBOM (Cosign)
    needs: image
    uses: miguelortiz13/github-workflows/.github/workflows/container-sign.yml@v0.4.0
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image-ref: ${{ needs.image.outputs.ref }}

  api:
    name: API → Container Apps
    # Solo se despliega una imagen firmada.
    needs: [image, sign]
    if: vars.AZURE_CLIENT_ID != ''
    uses: miguelortiz13/github-workflows/.github/workflows/deploy-azure-container-app.yml@v0.4.0
    permissions:
      contents: read
      id-token: write
    with:
      environment: prod
      app-name: ${{ vars.SSPM_API_APP }}
      resource-group: ${{ vars.SSPM_RESOURCE_GROUP }}
      image: ${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}
      # La API escala a cero: el primer arranque (migraciones incluidas) tarda.
      health-path: /api/v1/health
      health-expect: '"database":"up"'

  web:
    name: Frontend → Static Web Apps
    needs: api
    if: vars.AZURE_CLIENT_ID != ''
    uses: miguelortiz13/github-workflows/.github/workflows/deploy-azure-static-web-app.yml@v0.4.0
    permissions:
      contents: read
      id-token: write
    with:
      environment: prod
      app-name: ${{ vars.SSPM_SWA_NAME }}
      resource-group: ${{ vars.SSPM_RESOURCE_GROUP }}
      working-directory: frontend
      build-env: |
        VITE_API_BASE=${{ vars.SSPM_API_URL }}/api/v1
      verify-paths: / /login /assets/demo
