name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test:
    name: Backend · lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prisma generate
      - run: npm test -- --ci

  backend-e2e:
    name: Backend · e2e tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: sspm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:admin@localhost:5432/sspm_db?schema=public
      JWT_SECRET: ci-test-secret-not-for-production
      SEED_DEMO_DATA: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:e2e -- --ci

  frontend-lint-typecheck:
    name: Frontend · lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker-build:
    name: Docker · build de imágenes (producción)
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build imagen backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: production
          push: false
          tags: sspm-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build imagen frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: production
          push: false
          tags: sspm-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
