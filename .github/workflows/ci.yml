name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

# Pasos estándar con miguelortiz13/github-workflows; la política de commits y
# las pruebas e2e con PostgreSQL son propias del proyecto.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    name: Commits · autoría y nombre de rama
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar ramas y mensajes de commit (ver CONTRIBUTING.md)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          status=0
          if ! printf '%s' "$HEAD_REF" | grep -Eq '^(develop|(feature|fix|hotfix|release|chore|docs|refactor|test|ci|build)/[a-z0-9._-]+)$'; then
            echo "::error::La rama '$HEAD_REF' no sigue la convención: feature/<desc>, fix/<desc>, hotfix/<desc>, release/<version>, chore/<desc>, docs/<desc>..."
            status=1
          fi
          # Solo se revisan los commits nuevos del PR (no los que ya están en main).
          for sha in $(git rev-list "$HEAD_SHA" "^$BASE_SHA" ^origin/main); do
            if git log -1 --format=%B "$sha" | grep -Eiq '^(co-authored-by:.*(noreply@anthropic\.com|copilot|cursor|chatgpt|openai|devin)|claude-session:|generated with \[)'; then
              echo "::error::El commit $(git log -1 --format='%h %s' "$sha") incluye una coautoría o firma automática de un asistente."
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Corrige los mensajes (git commit --amend / git rebase) y la configuración de tu asistente; ver CONTRIBUTING.md."
          fi
          exit "$status"

  backend-lint-test:
    name: Backend · lint + unit tests
    uses: miguelortiz13/github-workflows/.github/workflows/build-node.yml@v0.4.0
    with:
      node-version: "22"
      working-directory: backend
      install-command: npm ci && npx prisma generate
      scripts: lint test

  backend-e2e:
    name: Backend · e2e tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: sspm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:admin@localhost:5432/sspm_db?schema=public
      JWT_SECRET: ci-test-secret-not-for-production
      SEED_DEMO_DATA: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:e2e -- --ci

  frontend-lint-typecheck:
    name: Frontend · lint + typecheck + build
    uses: miguelortiz13/github-workflows/.github/workflows/build-node.yml@v0.4.0
    with:
      node-version: "22"
      working-directory: frontend
      scripts: lint typecheck build

  # Las imágenes de producción se construyen y escanean (Trivy) sin publicarse:
  # la de la API se publica y firma en deploy-azure.yml al llegar a main.
  image-api:
    name: Docker · imagen backend (build + Trivy)
    needs: [backend-lint-test, frontend-lint-typecheck]
    uses: miguelortiz13/github-workflows/.github/workflows/container-build.yml@v0.4.0
    permissions:
      contents: read
      packages: write
    with:
      image-name: sspm-api
      context: backend
      target: production
      push: false

  image-web:
    name: Docker · imagen frontend (build + Trivy)
    needs: [backend-lint-test, frontend-lint-typecheck]
    uses: miguelortiz13/github-workflows/.github/workflows/container-build.yml@v0.4.0
    permissions:
      contents: read
      packages: write
    with:
      image-name: sspm-web
      context: frontend
      target: production
      push: false

  secrets-scan:
    name: Seguridad · escaneo de secretos (Gitleaks)
    uses: miguelortiz13/github-workflows/.github/workflows/security-baseline.yml@v0.4.0
    permissions:
      contents: read
      pull-requests: write
    with:
      # Requiere Dependency graph activo (lo activa un admin del repo).
      dependency-review: false
