# ---------------------------------------------------------------------------
# SSPM - SaaS Lite | Entorno local con Docker
#
#   Levantar base de datos + API + web:   docker compose up -d --build
#   Aplicación web:                       http://localhost:8080
#   Ver los logs de la API:               docker compose logs -f api
#   Detener:                        docker compose down
#   Detener y borrar la base:       docker compose down -v
#
# Modo desarrollo con recarga en caliente: ver docker-compose.dev.yml.
# Acceso a PostgreSQL desde tu equipo (pgAdmin, DBeaver...): ver
# docker-compose.db-access.yml.
# Las variables ${...} se pueden ajustar en un archivo .env junto a este
# (ver .env.example). Este archivo está pensado para uso local: no lo uses
# tal cual en un servidor público.
# ---------------------------------------------------------------------------
name: sspm

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: sspm_db
    # Sin puertos publicados: la API accede por la red interna de Docker y así
    # no hay conflictos con un PostgreSQL instalado en el equipo.
    volumes:
      - sspm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sspm_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: production
    image: sspm-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-admin}@db:5432/sspm_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-secreto-local-de-desarrollo-cambialo-en-produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3001}
      # Crea la organización y los usuarios de demostración al arrancar.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # Motor de escaneo
      SCAN_MAX_CONCURRENCY: ${SCAN_MAX_CONCURRENCY:-2}
      SCAN_MAX_CONCURRENCY_PER_ORG: ${SCAN_MAX_CONCURRENCY_PER_ORG:-1}
      SCAN_MAX_PER_HOUR_PER_ORG: ${SCAN_MAX_PER_HOUR_PER_ORG:-30}
      SCAN_TIMEOUT_SECONDS: ${SCAN_TIMEOUT_SECONDS:-600}
      SCAN_TOP_PORTS: ${SCAN_TOP_PORTS:-1000}
      SCAN_PORTS: ${SCAN_PORTS:-}
      WEB_HTTP_PORTS: ${WEB_HTTP_PORTS:-80}
      WEB_HTTPS_PORTS: ${WEB_HTTPS_PORTS:-443}
      # Monitoreo continuo (sección 10.4)
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-60000}
      # Alertas (RF-10): enlaces de las notificaciones y servidor de correo.
      # Sin SMTP_HOST los canales de correo se omiten; los webhooks funcionan igual.
      APP_URL: ${APP_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-SSPM Alertas <alertas@sspm.local>}
      # La web (Nginx) hace de proxy: un salto de confianza para conocer la IP
      # real del cliente en los límites del inicio de sesión.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      AUTH_MAX_FAILED_LOGINS: ${AUTH_MAX_FAILED_LOGINS:-5}
      AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES:-15}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    extra_hosts:
      # Permite escanear servicios de tu equipo en modo laboratorio.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  web:
    build:
      context: ./frontend
      target: production
    image: sspm-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"

volumes:
  sspm_pgdata:
