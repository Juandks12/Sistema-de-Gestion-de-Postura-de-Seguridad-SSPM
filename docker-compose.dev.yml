# ---------------------------------------------------------------------------
# Modo desarrollo: el código de ./backend y ./frontend se monta en los
# contenedores. Nest reinicia la API y Vite recarga la web al guardar cambios.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   Aplicación web: http://localhost:5173
#   Correos de alerta (Mailpit): http://localhost:8025
#
# Ejecutar comandos dentro del contenedor (con la API levantada):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml exec api npm test
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml exec api npx prisma migrate dev --name <nombre>
# ---------------------------------------------------------------------------
services:
  api:
    build:
      target: development
    image: sspm-api:dev
    restart: "no"
    environment:
      NODE_ENV: development
      # Modo laboratorio: permite escanear IPs privadas y host.docker.internal.
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      # Verificación de propiedad antes de escanear. Se puede desactivar solo en desarrollo.
      ASSET_VERIFICATION_REQUIRED: ${ASSET_VERIFICATION_REQUIRED:-true}
      # Detección de cambios por sondeo: necesaria en Windows y macOS, donde
      # los eventos del sistema de archivos no llegan al contenedor.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
      # Los correos de alerta se capturan en Mailpit en lugar de enviarse.
      APP_URL: http://localhost:${WEB_PORT:-5173}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
    depends_on:
      mailpit:
        condition: service_started
    volumes:
      - ./backend:/app
      # node_modules propio del contenedor (Linux), aislado del de tu equipo.
      - /app/node_modules

  # Servidor SMTP de pruebas: recibe los correos de alerta y los muestra en una web.
  mailpit:
    image: axllent/mailpit:v1.31
    restart: "no"
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  web:
    build:
      target: development
    image: sspm-web:dev
    restart: "no"
    environment:
      # Vite reenvía /api al contenedor de la API.
      API_PROXY_TARGET: http://api:3000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
