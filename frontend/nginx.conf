# Sirve la aplicación compilada y reenvía /api al backend dentro de la red de Docker.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad de la propia aplicación (sección 11 del documento).
    # Nota: un `add_header` dentro de un `location` anularía estas; por eso las
    # ubicaciones usan `expires` para la caché en lugar de `add_header`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: mismo origen, sin CORS. La ruta se conserva (/api/v1/...).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Recursos con hash en el nombre: caché larga.
    location /assets/ {
        expires 1y;
    }

    # Aplicación de una sola página: cualquier ruta devuelve index.html, sin caché.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
